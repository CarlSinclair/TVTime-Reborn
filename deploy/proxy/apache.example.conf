# Needs: a2enmod proxy proxy_http ssl headers rewrite deflate
# Replace example.com and the certificate paths. TVT listens on 127.0.0.1:9911.
<VirtualHost *:80>
    ServerName example.com
    Redirect permanent / https://example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName example.com

    SSLEngine on
    SSLCertificateFile    /etc/ssl/example.com/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/example.com/privkey.pem

    LimitRequestBody 8388608
    AddOutputFilterByType DEFLATE text/css application/javascript application/json image/svg+xml

    ProxyPreserveHost On
    # mod_proxy appends the real client address to X-Forwarded-For; TVT reads the
    # right-most entry, so a spoofed left-hand value is ignored.
    RequestHeader set X-Forwarded-Proto "https"

    # live notification stream: keep the connection open, do not buffer
    ProxyPass        /api/notifications/stream http://127.0.0.1:9911/api/notifications/stream flushpackets=on timeout=3600
    ProxyPassReverse /api/notifications/stream http://127.0.0.1:9911/api/notifications/stream

    ProxyPass        / http://127.0.0.1:9911/
    ProxyPassReverse / http://127.0.0.1:9911/
</VirtualHost>
