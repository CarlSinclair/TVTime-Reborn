name: build & deploy

# Runs only for the owner's repository, only on a push to main whose commit
# message contains [deploy], or when started by hand. Pull requests (including
# ones from forks) never run this workflow and never see its secrets.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-tvt
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository_owner == 'CarlSinclair' &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: test
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 ./...

      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w -X tvt/logger.Version=$(((GITHUB_RUN_NUMBER - 1) / 10)).$(((GITHUB_RUN_NUMBER - 1) % 10))" -o tvt .
          file tvt

      - name: deploy over ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY"     > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -czf tvt.tar.gz tvt
          SHA=$(sha256sum tvt.tar.gz | cut -d' ' -f1)
          echo "shipping tvt.tar.gz sha256=$SHA bytes=$(stat -c%s tvt.tar.gz)"
          ssh -i ~/.ssh/id_ed25519 -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "deploy@$DEPLOY_HOST" "tvt $SHA" < tvt.tar.gz
          shred -u ~/.ssh/id_ed25519 || rm -f ~/.ssh/id_ed25519

  release:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build for every platform
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="$(((GITHUB_RUN_NUMBER - 1) / 10)).$(((GITHUB_RUN_NUMBER - 1) % 10))"
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            name=tvt-v${VERSION}-${os}-${arch}
            ext=""; [ "$os" = windows ] && ext=".exe"
            mkdir "dist/$name"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X tvt/logger.Version=${VERSION}" -o "dist/$name/tvt$ext" .
            cp LICENSE NOTICE README.md PRIVACY.md tvt.env.example "dist/$name/"
            if [ "$os" = windows ]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
            rm -rf "dist/$name"
          done
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(((GITHUB_RUN_NUMBER - 1) / 10)).$(((GITHUB_RUN_NUMBER - 1) % 10))"
          gh release create "v${VERSION}" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v${VERSION}" --notes "Commit ${GITHUB_SHA::7}. Verify downloads against SHA256SUMS." --latest
