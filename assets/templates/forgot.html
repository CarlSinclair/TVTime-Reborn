{{define "content"}}
<section class="auth-card">
  <h1>{{.T "auth.forgot"}}</h1>
  <form class="stack" data-api="/api/auth/forgot" data-success="{{.T "auth.forgot_sent"}}">
    <label>{{.T "auth.email"}}<input type="email" name="email" autocomplete="email" required></label>
    <label>{{.T "mfa.reset_label"}}<input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="32"></label>
    <button class="btn ghost" type="button" data-forgot-send="/api/auth/forgot/code" data-query-from="input[name=email]" data-query-name="email" data-text-sent="{{.T "mfa.reset_sent"}}" data-text-wait="{{.T "mfa.email_wait"}}" data-text-failed="{{.T "mfa.tg_failed"}}">{{.T "mfa.reset_send"}}</button>
    <p class="form-error" role="alert" hidden></p>
    <button class="btn" type="submit">{{.T "auth.send_link"}}</button>
  </form>
</section>
<script src="/static/twofa/confirm.js" data-cancel-class="btn ghost" defer></script>
{{end}}
