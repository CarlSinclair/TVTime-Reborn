{{define "content"}}
{{if .Data.NoMetadata}}<div class="notice">{{.T "home.no_metadata"}}</div>{{end}}
<section>
  <h2>{{.T "home.up_next"}}</h2>
  <div class="upnext" id="upnext">
    {{range .Data.UpNext}}{{template "upnext_card" (dict "It" . "V" $)}}{{end}}
  </div>
  <p class="muted" id="upnext-empty" {{if .Data.UpNext}}hidden{{end}}>{{.T "home.up_next_empty"}}</p>
</section>
{{end}}
