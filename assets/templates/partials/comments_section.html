{{define "comments_section"}}
<section id="comments" class="comments" data-kind="{{.Kind}}" data-target="{{.Target}}" data-logged="{{if .V.User}}1{{else}}0{{end}}" data-verified="{{if and .V.User .V.User.CanComment}}1{{else}}0{{end}}" data-admin="{{if and .V.User .V.User.IsAdmin}}1{{else}}0{{end}}">
  <h2>{{.V.T "comments.title"}} <small id="comments-count"></small></h2>
  {{if .V.User}}
    {{if .V.User.CanComment}}
    <form class="comment-form" id="comment-form">
      <textarea name="body" maxlength="2000" rows="3" placeholder="{{.V.T "comments.placeholder"}}" required></textarea>
      <div class="comment-form-row">
        <span class="notify-row spoiler-row"><span class="tswitch sm"><input type="checkbox" class="tswitch-input" id="ep-spoiler" name="spoiler"><label for="ep-spoiler" class="tswitch-label"><span class="ball"></span></label></span><label class="notify-text" for="ep-spoiler">{{.V.T "comments.mark_spoiler"}}</label></span>
        <button class="btn" type="submit">{{.V.T "comments.post"}}</button>
      </div>
    </form>
    {{else if .V.User.IsBanned}}
    <p class="notice">{{.V.T "err.read_only"}}</p>
    {{else}}
    <p class="notice">{{.V.T "comments.verify_needed"}}</p>
    {{end}}
  {{else}}
  <p class="muted"><a href="/login">{{.V.T "comments.login_needed"}}</a></p>
  {{end}}
  <ul class="comment-list" id="comment-list"></ul>
  <p class="center"><button class="btn ghost" type="button" id="comments-more" hidden>{{.V.T "comments.load_more"}}</button></p>
</section>
{{end}}
