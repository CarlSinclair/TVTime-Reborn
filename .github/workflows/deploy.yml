name: build & deploy

# Runs only for the owner's repository, only on a push to main whose commit
# message contains [deploy], or when started by hand. Pull requests (including
# ones from forks) never run this workflow and never see its secrets.
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Redeploy an existing release without rebuilding: a tag such as v12.3, or the word latest. Leave empty to build from the branch.'
        required: false
        default: ''
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-tvt
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository_owner == 'CarlSinclair' &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: mode
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          REL_INPUT: ${{ inputs.release }}
        run: |
          set -euo pipefail
          rel="$REL_INPUT"
          if [ "$rel" = latest ]; then
            rel=$(gh release list --limit 200 --json tagName -q '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
            [ -n "$rel" ] || { echo "redeploy requested but no release exists" >&2; exit 1; }
          fi
          case "$rel" in ""|v[0-9]*) ;; *) echo "release must look like v<major>.<minor> or latest, got '$rel'" >&2; exit 2 ;; esac
          [ -z "$rel" ] || echo "redeploy: reusing release $rel, nothing is rebuilt"
          echo "release=$rel" >> "$GITHUB_OUTPUT"

      - name: test
        if: steps.mode.outputs.release == ''
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 ./...

      - name: build for every platform
        if: steps.mode.outputs.release == ''
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="$(((GITHUB_RUN_NUMBER - 1) / 10)).$(((GITHUB_RUN_NUMBER - 1) % 10))"
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            name=tvt-v${VERSION}-${os}-${arch}
            ext=""; [ "$os" = windows ] && ext=".exe"
            mkdir "dist/$name"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X github.com/CarlSinclair/csuit-libs/logger.Version=${VERSION}" -o "dist/$name/tvt$ext" .
            cp LICENSE NOTICE README.md PRIVACY.md tvt.env.example "dist/$name/"
            if [ "$os" = windows ]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
            rm -rf "dist/$name"
          done
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist

      # Published BEFORE the deploy job so a failed ssh or install still leaves
      # the exact build behind; ./ship --redeploy reinstalls it.
      - name: publish release
        if: steps.mode.outputs.release == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(((GITHUB_RUN_NUMBER - 1) / 10)).$(((GITHUB_RUN_NUMBER - 1) % 10))"
          TAG="v${VERSION}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes "Commit ${GITHUB_SHA::7}. Verify downloads against SHA256SUMS." --latest \
            || gh release view "$TAG" >/dev/null
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: tag
        id: tag
        run: |
          set -euo pipefail
          rel="${{ steps.mode.outputs.release }}"
          if [ -z "$rel" ]; then
            rel="v$(((GITHUB_RUN_NUMBER - 1) / 10)).$(((GITHUB_RUN_NUMBER - 1) % 10))"
          fi
          echo "tag=$rel" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - name: fetch release binary
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p 'tvt-v*-linux-amd64.tar.gz' -p SHA256SUMS
          sha256sum -c SHA256SUMS --ignore-missing
          tar -xzf tvt-v*-linux-amd64.tar.gz --strip-components=1 --wildcards '*/tvt'
          file tvt

      - name: deploy over ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY"     > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -czf tvt.tar.gz tvt
          SHA=$(sha256sum tvt.tar.gz | cut -d' ' -f1)
          echo "shipping tvt.tar.gz sha256=$SHA bytes=$(stat -c%s tvt.tar.gz)"
          ssh -i ~/.ssh/id_ed25519 -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "deploy@$DEPLOY_HOST" "tvt $SHA" < tvt.tar.gz
          shred -u ~/.ssh/id_ed25519 || rm -f ~/.ssh/id_ed25519
