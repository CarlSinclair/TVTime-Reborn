{{define "friend_button"}}
{{if eq .State "none"}}<button class="icon-btn solid" type="button" data-friend-add="{{.Username}}" aria-label="{{.V.T "js.friend_add"}}" title="{{.V.T "js.friend_add"}}"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg?v={{assetV}}#fa-user-plus"></use></svg></button>
{{else if eq .State "outgoing"}}<span class="tag pending">{{.V.T "js.friend_pending"}}</span>
{{else if eq .State "incoming"}}<button class="icon-btn ok" type="button" data-friend-accept="{{.Username}}" aria-label="{{.V.T "js.friend_accept"}}" title="{{.V.T "js.friend_accept"}}"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg?v={{assetV}}#fa-check"></use></svg></button><button class="icon-btn no" type="button" data-friend-decline="{{.Username}}" aria-label="{{.V.T "js.friend_decline"}}" title="{{.V.T "js.friend_decline"}}"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg?v={{assetV}}#fa-x"></use></svg></button>
{{else}}<button class="icon-btn no" type="button" data-friend-remove="{{.Username}}" aria-label="{{.V.T "js.friend_remove"}}" title="{{.V.T "js.friend_remove"}}"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg?v={{assetV}}#fa-x"></use></svg></button>{{end}}
{{end}}
